<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Garden Pet Clicker</title>
  <style>
    body {
      margin: 0;
      background: #050505;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .top-bar {
      background: #111;
      padding: 15px 20px;
      box-shadow: 0 0 15px #000;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .top-bar .logo {
      font-weight: bold;
      font-size: 20px;
      color: #ffb347;
      text-shadow: 0 0 10px #ff8c00;
    }

    .top-bar .right-links {
      font-size: 14px;
      color: #ccc;
    }

    .top-bar a {
      color: #ffb347;
      text-decoration: none;
      margin-left: 10px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto 40px auto;
      padding: 0 15px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 5px;
      text-shadow: 0 0 15px #ff8c00;
    }

    .subtitle {
      font-size: 14px;
      color: #bbb;
      margin-bottom: 25px;
    }

    .game-wrapper {
      background: #111;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 0 20px #000;
      display: inline-block;
    }

    iframe {
      width: 1000px;
      height: 750px;
      border: none;
      background: #000;
    }

    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #aaa;
    }

    .back-link {
      margin-top: 25px;
      font-size: 14px;
    }

    .back-link a {
      color: #ffb347;
      text-decoration: none;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 1050px) {
      iframe {
        width: 95vw;
        height: 71vw; /* keeps similar aspect ratio */
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="logo">Scratch Unblocked</div>
    <div class="right-links">
      <span>Garden Pet Clicker</span>
      <a href="index.html">Home</a>
    </div>
  </div>

  <div class="container">
    <h1>Garden Pet Clicker</h1>
    <div class="subtitle">By Joey — hosted by Joel</div>

    <div class="game-wrapper">
      <iframe
        src="https://scratch.mit.edu/projects/1240362921/embed"
        allowtransparency="true"
        frameborder="0"
        scrolling="no"
        allowfullscreen>
      </iframe>
      <div class="hint">
        Tip: Use the square icon in the bottom-right of the game to go fullscreen.
      </div>
    </div>

    <div class="back-link">
      <a href="index.html">← Back to all games</a>
    </div>
  </div>

</body>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Garden Pet Clicker</title>
  <style>
    body {
      margin: 0;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
      color: #333;
    }

    .header {
      background: #ffffff;
      border-bottom: 2px solid #e5e5e5;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      color: #0d99ff;
      text-align: center;
    }

    .content {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 30px;
      padding: 0 20px;
    }

    /* Game box */
    .game-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    /* Smaller game */
    iframe {
      width: 650px;
      height: 480px;
      border: none;
      background: #000;
    }

    /* Buttons row */
    .button-row {
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .fullscreen-btn {
      background: #ff8c00;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .fullscreen-btn:hover {
      background: #e67a00;
    }

    .exit-btn {
      background: #0d99ff;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .exit-btn:hover {
      background: #0b7ed6;
    }

    /* Sidebar */
    .sidebar {
      width: 300px;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .sidebar h2 {
      margin-top: 0;
      color: #0d99ff;
    }

    /* Mobile */
    @media (max-width: 1000px) {
      .content {
        flex-direction: column;
        align-items: center;
      }
      iframe {
        width: 95vw;
        height: 70vw;
      }
      .sidebar {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <div class="header">Scratch Unblocked</div>

  <div class="content">

    <!-- GAME -->
    <div class="game-box">

      <!-- Buttons -->
      <div class="button-row">
        <a class="fullscreen-btn" href="mygame-fullscreen.html">
  Fullscreen
</a>

        <a class="exit-btn" href="index.html">
          Exit Game
        </a>
      </div>

      <iframe
        src="https://scratch.mit.edu/projects/1240362921/embed"
        allowtransparency="true"
        scrolling="no">
      </iframe>

    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <h2>About the Game</h2>
      <p><strong>Garden Pet Clicker</strong> is a fun pet‑raising clicker game where you grow, feed, and evolve your pixel pets.</p>
      <p>Created by Joey, hosted by Joel.</p>
      <p>Play in fullscreen for the best experience!</p>
    </div>

  </div>

</body>
</html>

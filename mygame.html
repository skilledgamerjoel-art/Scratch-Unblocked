<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Garden Pet Clicker</title>
  <style>
    body {
      margin: 0;
      background: #f2f2f2; /* Scratch light grey */
      font-family: Arial, sans-serif;
      text-align: center;
      color: #333;
    }

    /* Scratch-style top bar */
    .header {
      background: #ffffff;
      border-bottom: 2px solid #e5e5e5;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      color: #0d99ff; /* Scratch blue */
    }

    h1 {
      margin-top: 25px;
      font-size: 28px;
      color: #333;
    }

    /* White box around the game like Scratch */
    .game-box {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: inline-block;
      margin-top: 20px;
    }

    iframe {
      width: 960px;
      height: 720px;
      border: none;
      background: #000;
    }

    .back {
      margin-top: 20px;
      font-size: 16px;
    }

    .back a {
      color: #0d99ff;
      text-decoration: none;
    }

    .back a:hover {
      text-decoration: underline;
    }

    /* Mobile scaling */
    @media (max-width: 1000px) {
      iframe {
        width: 95vw;
        height: 70vw;
      }
    }
  </style>
</head>
<body>

  <div class="header">Scratch Unblocked</div>

  <h1>Garden Pet Clicker</h1>

  <div class="game-box">
    <iframe
      src="https://scratch.mit.edu/projects/1240362921/embed"
      allowtransparency="true"
      allowfullscreen
      scrolling="no">
    </iframe>
  </div>

  <div class="back">
    <a href="index.html">← Back to all games</a>
  </div>

</body>
</html>

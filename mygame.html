<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Garden Pet Clicker</title>
  <style>
    body {
      margin: 0;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
      color: #333;
    }

    .header {
      background: #ffffff;
      border-bottom: 2px solid #e5e5e5;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      color: #0d99ff;
      text-align: center;
    }

    .content {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 15px; /* moved up */
      padding: 0 20px;
    }

    /* Game box */
    .game-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
      margin-top: -10px; /* moved up */
    }

    iframe {
      width: 650px;
      height: 480px;
      border: none;
      background: #000;
    }

    .button-row {
      margin-bottom: 10px; /* moved up */
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .fullscreen-btn {
      background: #ff8c00;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .fullscreen-btn:hover {
      background: #e67a00;
    }

    .exit-btn {
      background: #0d99ff;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .exit-btn:hover {
      background: #0b7ed6;
    }

    /* Sidebar */
    .sidebar {
      width: 300px;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .sidebar h2 {
      margin-top: 0;
      color: #0d99ff;
    }

    /* Mobile */
    @media (max-width: 1000px) {
      .content {
        flex-direction: column;
        align-items: center;
      }
      iframe {
        width: 95vw;
        height: 70vw;
      }
      .sidebar {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <div class="header">Scratch Unblocked</div>

  <div class="content">

    <!-- GAME -->
    <div class="game-box">

      <!-- Buttons -->
      <div class="button-row">
        <a class="fullscreen-btn" href="mygame-fullscreen.html">Fullscreen</a>
        <a class="exit-btn" href="index.html">Exit Game</a>
      </div>

      <iframe
        src="https://scratch.mit.edu/projects/1240362921/embed"
        allowtransparency="true"
        scrolling="no">
      </iframe>

      <!-- COMMENT SECTION -->
      <div style="
        margin-top: 20px;
        background: #ffffff;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        text-align: left;
      ">
        <h3 style="color:#0d99ff; margin-top:0;">Comments</h3>

        <!-- Comment input -->
        <textarea id="commentInput" placeholder="Add a comment..." 
          style="
            width: 100%;
            height: 70px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            resize: none;
            font-size: 14px;
          ">
        </textarea>

        <button onclick="addComment()" style="
          margin-top: 10px;
          background: #0d99ff;
          color: white;
          padding: 8px 14px;
          border: none;
          border-radius: 6px;
          font-size: 14px;
          font-weight: bold;
          cursor: pointer;
        ">Post</button>

        <!-- Comment list -->
        <div id="commentList" style="margin-top: 15px;"></div>
      </div>

    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <h2>About the Game</h2>
      <p><strong>Garden Pet Clicker</strong> This is Garden Pet Clicker, a very fun clicker game to progress and get better the more you play</p>
      <p>Created by Deadlydevlopment</p>
      <p>Play in fullscreen for the best experience!</p>
      <p>Updating Soon</p>
    </div>

  </div>

  <!-- Comment script -->
  <script>
    function addComment() {
      const input = document.getElementById("commentInput");
      const list = document.getElementById("commentList");

      if (input.value.trim() === "") return;

      const comment = document.createElement("div");
      comment.style.padding = "10px";
      comment.style.marginBottom = "10px";
      comment.style.background = "#f7f7f7";
      comment.style.borderRadius = "6px";
      comment.style.border = "1px solid #ddd";
      comment.innerText = input.value;

      list.prepend(comment);
      input.value = "";
    }
  </script>

</body>
</html>

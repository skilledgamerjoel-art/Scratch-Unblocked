<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Garden Pet Clicker - Fullscreen</title>
  <style>
    body {
      margin: 0;
      background: #000;
      height: 100vh;
      overflow: hidden;
    }

    /* Tiny floating exit button */
    .exit-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0,0,0,0.5);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      text-decoration: none;
      font-weight: bold;
      z-index: 10;
      transition: 0.2s;
    }

    .exit-btn:hover {
      background: rgba(0,0,0,0.7);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <a class="exit-btn" href="mygame.html">Exit</a>

  <iframe
    src="https://scratch.mit.edu/projects/1240362921/embed"
    allowtransparency="true"
    scrolling="no">
  </iframe>

</body>
</html>

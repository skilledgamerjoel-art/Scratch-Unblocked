<!DOCTYPE html>
<html>
<head>
  <title>Unblocked Scratch Games</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 48px;
      text-shadow: 0 0 20px #ff8c00, 0 0 40px #ff8c00;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 18px;
      color: #ccc;
      margin-bottom: 40px;
    }

    .game-grid {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
      padding: 20px;
    }

    .game-card {
      background: #111;
      border-radius: 12px;
      width: 260px;
      padding: 15px;
      box-shadow: 0 0 15px #000;
      transition: 0.2s;
      text-decoration: none;
      color: white;
    }

    .game-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #ff8c00;
    }

    .game-card img {
      width: 100%;
      border-radius: 10px;
    }

    .game-title {
      margin-top: 10px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Scratch Unblocked</h1>
  <p class="subtitle">Spread this link to friends - Joel</p>

  <div class="game-grid">
    <a href="mygame.html" class="game-card">
  <img src="https://upload.wikimedia.org/wikipedia/commons/2/2d/Scratch_logo.svg">
  <div class="game-title">My First Game</div>
</a>

    <!-- Example game card -->
    <a href="mygame.html" class="game-card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2d/Scratch_logo.svg">
      <div class="game-title">My First Game</div>
    </a>

  </div>

</body>
</html>
